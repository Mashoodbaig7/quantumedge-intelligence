kind = "web"
previewPath = "/"
title = "QuantumEdge Intelligence"
version = "1.0.0"
id = "artifacts/quantumedge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22022

[services.development]
run = "pnpm --filter @workspace/quantumedge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quantumedge", "run", "build" ]
publicDir = "artifacts/quantumedge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22022"
BASE_PATH = "/"
